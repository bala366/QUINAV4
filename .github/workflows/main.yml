name: Compilar APK Quina Posicional V4

on:
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir estrutura
        run: |
          echo "========================================"
          echo "QUINA POSICIONAL V4"
          echo "CONFERINDO PROJETO"
          echo "========================================"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Estrutura encontrada com sucesso."

      - name: Compilar APK
        run: |
          echo "========================================"
          echo "COMPILANDO APK"
          echo "========================================"

          gradle :app:assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK NAO FOI GERADO."
            exit 1
          fi

          echo "APK GERADO COM SUCESSO:"
          ls -lh "$APK"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: QUINA-POSICIONAL-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
